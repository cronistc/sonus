<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- o desenho é o do Galaxy A54 (384 px de largura): em qualquer celular a tela inteira é ampliada/reduzida
     na mesma proporção (no A54 a escala é 1). Larguras ligadas a isto: SounosEscala (native.js) e MainActivity -->
<meta name="viewport" content="width=384, user-scalable=no">
<title>Sonus · Tocando</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">

<link rel="stylesheet" href="fonts/fonte.css">
<link rel="stylesheet" href="modulos/player/player.css">
<script>
// promessa resolvida quando a transição de abertura terminar (ou na hora, se não houver transição)
window.__afterReveal = new Promise(res => addEventListener("pagereveal", e => {
  if (e.viewTransition) e.viewTransition.finished.then(res, res); else res();
}, { once: true }));
</script>
<script src="modulos/base/native.js"></script>
<link rel="stylesheet" href="modulos/base/transitions.css">
<link rel="stylesheet" href="modulos/menus/add.css">
<script src="modulos/base/data.js"></script>
<script src="modulos/menus/add.js"></script>
<link rel="stylesheet" href="modulos/base/theme.css">
<link rel="stylesheet" href="modulos/dicas/dicas.css">
<script src="modulos/dicas/dicas.js"></script>
<script src="modulos/configuracoes/settings.js"></script>
</head>
<body>
<div class="phone paused" id="phone">

  <div class="cover-area" id="coverArea">
    <div class="cover-box">
      <div class="ring" id="ring">
        <!-- Barra de progresso = borda da capa: começa no topo-centro e contorna no sentido horário até fechar -->
        <svg class="prog" id="ringSvg">
          <defs>
            <linearGradient id="ringGrad" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0"   stop-color="var(--c1)"/>
              <stop offset=".35" stop-color="var(--c2)"/>
              <stop offset=".7"  stop-color="var(--c3)"/>
              <stop offset="1"   stop-color="var(--c1)"/>
            </linearGradient>
            <!-- esfumaçado: transparente no ponto exato da ponta → opaco a FADE_PX de distância -->
            <radialGradient id="fadeGrad">
              <stop offset="0"   stop-color="#000"/>
              <stop offset=".25" stop-color="#1a1a1a"/>
              <stop offset=".5"  stop-color="#777"/>
              <stop offset=".75" stop-color="#d4d4d4"/>
              <stop offset="1"   stop-color="#fff"/>
            </radialGradient>
            <mask id="ringMask" maskUnits="userSpaceOnUse">
              <rect id="maskBg" fill="#fff"/>
              <circle id="fadeStart" fill="url(#fadeGrad)"/>
              <circle id="fadeHead"  fill="url(#fadeGrad)"/>
            </mask>
          </defs>
          <path id="ringPath" class="track-path" pathLength="1000"/>
          <path id="ringFill" class="fill-path" pathLength="1000" stroke-dasharray="0 2000" mask="url(#ringMask)" style="display:none"/>
          <path id="ringHit" class="hit"/>
          <circle id="knob" class="knob"/>
        </svg>
        <canvas class="prog" id="ringCanvas" aria-hidden="true"></canvas>
        <div class="cover" id="cover">A</div>
      </div>
      <div class="times" id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
  </div>

  <div class="below">
    <div class="info" id="info">
      <button class="share-btn" id="shareBtn" aria-label="Compartilhar letra">
          <svg class="lu" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg>
        </button>
      <div class="txt fadeable"><h1 id="title">—</h1><p id="artist">—</p></div>
      <div class="actions">
        <button class="act" id="lyricsBtn" aria-label="Letra"><span class="letter">A</span></button>
        <!-- baixar: um toque, sem janela; o anel mostra o progresso e o ícone fica cheio quando termina -->
        <button class="act dl" id="dlBtn" aria-label="Baixar música">
          <svg viewBox="0 0 24 24" class="dl-ic">
            <circle class="dl-track" cx="12" cy="12" r="9.5"/>
            <circle class="dl-prog" cx="12" cy="12" r="9.5" pathLength="100"/>
            <circle class="dl-fill" cx="12" cy="12" r="10.6"/>
            <path class="dl-arrow" d="M12 7.5L12 15.7M8.5 12.2L12 15.7M15.5 12.2L12 15.7"/>
          </svg>
        </button>
        <button class="act" id="addBtn" aria-label="Adicionar">
          <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        </button>
      </div>
    </div>

    <div class="main-ui fadeable">
      <!-- Fila: playlist (ou ela embaralhada) · lista aleatória (música pesquisada) · sugeridas (repetir faixa).
           toque = tocar · arrastar = rolar · segurar o bloco e arrastar = reordenar -->
      <div class="queue-wrap" id="queueWrap"><div class="queue" id="queue"></div></div>
      <div class="spacer"></div>

      <div class="controls" id="controls">
        <button class="skip" id="prev" aria-label="Voltar">
          <svg class="lu solid" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
        </button>
        <!-- Botão multifunção:
             toque = play/pause · segurar e soltar = ciclo de repetição
             segurar + arrastar p/ cima ou baixo = aleatório · segurar + arrastar p/ o lado = modo scrub -->
        <button class="play" id="play" aria-label="Tocar">
          <span class="icon" id="playIcon"></span>
          <div class="scrubber" id="scrubber">
            <div class="wave dim" id="waveDim"></div>
            <div class="lens"><div class="needle"></div><div class="wave big" id="waveBig"></div></div>
          </div>
        </button>
        <button class="skip" id="next" aria-label="Avançar">
          <svg class="lu solid" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
        </button>
        <div class="scrub-time" id="scrubTime">0:00</div>
      </div>
    </div>

    <!-- Letra sincronizada: aparece no lugar do nome, artista, fila e botões -->
    <div class="lyr" id="lyr">
      <div class="lines" id="lines"></div>
      <!-- seleção de trechos para compartilhar (até 10 linhas) -->
      <div class="selbar">
        <button class="link" id="selCancel">Cancelar</button>
        <span class="count" id="selCount">0/10</span>
        <button class="go" id="selGo" disabled>Gerar imagem</button>
      </div>
    </div>
  </div>

  <!-- Imagem da letra compartilhada -->
  <div class="sheet" id="sheet">
    <button class="close" id="sheetClose" aria-label="Fechar"><svg class="lu" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <img id="cardImg" alt="Imagem da letra">
    <div class="styles" id="cardStyles">
      <button data-style="grad" class="on"><span class="sw grad"></span>Gradiente</button>
      <button data-style="dark"><span class="sw dark"></span>Escuro</button>
      <button data-style="light"><span class="sw light"></span>Claro</button>
    </div>
    <div class="row">
      <button id="saveCard">Salvar imagem</button>
      <button id="sendCard" class="primary">Compartilhar</button>
    </div>
  </div>
</div>

<script src="modulos/player/player.js"></script>
<script src="modulos/player/player-voltar.js"></script>
<script src="modulos/player/player-native.js"></script>
<script src="modulos/base/marquee.js" defer></script>
</body>
</html>
