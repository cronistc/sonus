<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- o desenho é o do Galaxy A54 (384 px de largura): em qualquer celular a tela inteira é ampliada/reduzida
     na mesma proporção (no A54 a escala é 1). Larguras ligadas a isto: SounosEscala (native.js) e MainActivity -->
<meta name="viewport" content="width=384, user-scalable=no">
<title>Sonus</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">

<link rel="stylesheet" href="fonts/fonte.css">
<link rel="stylesheet" href="modulos/inicio/inicio.css">
<link rel="stylesheet" href="modulos/mini-player/mini-player.css">
<link rel="stylesheet" href="modulos/busca/search.css">
<link rel="stylesheet" href="modulos/menus/add.css">
<link rel="stylesheet" href="modulos/base/transitions.css">
<script src="modulos/base/native.js"></script>
<script src="modulos/base/data.js"></script>
<script src="modulos/menus/add.js"></script>
<script src="modulos/menus/track-menu.js"></script>
<link rel="stylesheet" href="modulos/configuracoes/settings.css">
<link rel="stylesheet" href="modulos/base/theme.css">
<link rel="stylesheet" href="modulos/dicas/dicas.css">
<link rel="stylesheet" href="modulos/abertura/boas-vindas.css">
<script src="modulos/dicas/dicas.js"></script>
<script src="modulos/atualizacao/update.js"></script>
<script src="modulos/configuracoes/support.js"></script>
<script src="modulos/configuracoes/settings.js"></script>
<link rel="stylesheet" href="modulos/paginas/pages.css">
<script src="modulos/paginas/pages.js"></script>
</head>
<body>
<div class="phone" id="phone">
<script>
  // abriu a tela do zero (sem transição vinda do player)? então os blocos entram em cascata
  addEventListener("pagereveal", e => {
    if (!e.viewTransition) document.getElementById("phone").classList.add("intro");
    else e.viewTransition.types.add("close");           // voltando do player: ele desce
  });
</script>
  <div class="scroll">
    <div class="head">
      <button class="icon-btn" id="gearBtn" aria-label="Configurações">
        <svg class="lu" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <svg class="brand-letter" id="brandLetter" viewBox="0 0 64 64" role="img" aria-label="Sonus"><title>Sonus</title><path d="M 42.54 39.23 Q 42.54 45.1 37.09 47.15 Q 37.16 47.5 38 51.43 Q 38.55 53.99 38.55 55.74 Q 38.55 58.4 36.74 60.07 Q 34.92 61.74 32.26 61.74 Q 29.89 61.74 28.11 60.41 Q 26.13 58.95 26.13 56.68 Q 26.13 55.22 27.15 53.91 Q 28.17 52.59 29.6 52.59 Q 30.99 52.59 31.97 53.66 Q 32.94 54.74 32.94 56.13 Q 32.94 59.24 29.47 59.24 Q 30.35 60.61 32.29 60.61 Q 33.91 60.61 35.31 59.7 Q 37.35 58.37 37.35 55.09 Q 37.35 53.89 35.96 47.57 Q 34.56 47.89 33.26 47.89 Q 28.46 47.89 24.96 44.23 Q 21.46 40.56 21.46 35.73 Q 21.46 31.55 24.44 27.23 Q 26.16 24.77 30.57 20.36 Q 29.47 16.4 29.47 12.86 Q 29.47 10.01 30.28 7.32 Q 31.29 4.01 33.14 2.68 Q 33.82 2.19 34.4 2.19 Q 34.98 2.19 35.54 2.84 Q 38.16 5.96 38.16 11.79 Q 38.16 19.87 32.58 25.03 L 33.78 30.83 Q 34.66 30.67 35.24 30.67 Q 38.49 30.67 40.59 33.39 Q 42.54 35.89 42.54 39.23Z M 36.77 9.88 Q 36.77 7.12 35.08 7.12 Q 33.07 7.12 31.81 10.66 Q 30.8 13.38 30.8 15.91 Q 30.8 17.83 31.51 19.51 Q 33.36 18.38 35.06 15.23 Q 36.77 12.09 36.77 9.88Z M 40.24 40.89 Q 40.24 38.29 38.71 36.57 Q 37.09 34.79 34.53 34.79 L 36.8 46.08 Q 40.24 44.65 40.24 40.89Z M 35.76 46.43 33.46 34.92 Q 32.03 35.34 30.96 36.65 Q 29.89 37.97 29.89 39.43 Q 29.89 41.31 31.37 42.57 Q 32.84 43.84 32.84 43.74 L 32.49 43.97 Q 30.48 43.45 29.18 41.81 Q 27.88 40.17 27.88 38.1 Q 27.88 35.92 29.26 33.9 Q 30.64 31.87 32.65 31.09 L 31.64 25.87 Q 23.89 32.32 23.89 38.45 Q 23.89 42.02 26.62 44.52 Q 29.24 46.95 32.84 46.95 Q 33.72 46.95 35.76 46.43Z M 18.64 -10.91Z M 63.85 73.29Z"/></svg>
      <span class="offline-mark" id="offlineMark" role="status" aria-live="polite" hidden>Offline</span>
      <!-- Busca: o motor próprio cruza a pesquisa com o que a pessoa segue e ouve -->
      <button class="icon-btn" id="searchBtn" aria-label="Buscar">
        <svg class="lu" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>

    <!-- Bloco dinâmico: janelas que passam para o lado (hoje: Ouvidos recentemente; offline: Minhas músicas) -->
    <section class="dyn-sec">
      <div class="dyn" id="dyn"><div class="dyn-track" id="dynTrack"></div><div class="dyn-dots" id="dynDots"></div></div>
    </section>

    <section class="vt-sec" data-modo="artistas">
      <div class="sec-head"><h2>Seus artistas</h2><button class="ver" data-ver="artistas">Ver tudo</button></div>
      <div class="row" id="artists"></div>
    </section>

    <section class="vt-sec" data-modo="playlists">
      <div class="sec-head"><h2>Suas playlists</h2><button class="ver" data-ver="playlists">Ver tudo</button></div>
      <div class="row" id="playlists"></div>
    </section>

    <!-- "Ver tudo": a própria tela inicial vira a lista completa (sem abrir outra tela) -->
    <div class="vt" id="vt"></div>

  </div>

  <div class="mini" id="mini">
    <div class="mrow">
    <div class="cv" id="miniCv"><span id="miniIni">L</span></div>
    <!-- nome = abre o player completo -->
    <div class="tx" id="miniOpen"><div class="t" id="miniT"></div><div class="a" id="miniA"></div><div class="time" id="miniTime"></div></div>
    <div class="ctrl">
      <!-- Usa o mesmo fluxo do botão "+" do player completo. -->
      <button class="add-btn" id="miniAdd" type="button" aria-label="Adicionar à playlist">
        <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
      <button class="sk" id="miniPrev" aria-label="Voltar">
        <svg class="lu solid" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/></svg>
      </button>
      <!-- toque = play/pause · segurar e soltar = repetição · segurar + arrastar p/ cima ou baixo = aleatório
           segurar + arrastar p/ o lado = avançar/voltar na música -->
      <button class="pp" id="miniPP" aria-label="Tocar"><span class="icon" id="miniIcon"></span></button>
      <button class="sk" id="miniNext" aria-label="Avançar">
        <svg class="lu solid" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
      </button>
    </div>
    </div>
    <div class="bar" id="miniBar"></div>
  </div>
</div>

<script src="modulos/inicio/inicio.js"></script>
<script src="modulos/mini-player/mini-player.js"></script>
<script src="modulos/base/home-native.js"></script>
<script src="modulos/inicio/inicio-app.js"></script>
<script src="modulos/mini-player/mini-player-app.js"></script>
<script src="modulos/atualizacao/clave-atualizacao.js"></script>
<script src="modulos/busca/search.js"></script>
<script>
window.homeSearch = SounosSearch.attach(document.getElementById("searchBtn"), document.getElementById("phone"));
SounosSettings.attach(document.getElementById("gearBtn"), document.getElementById("phone"));
</script>
<script src="modulos/base/marquee.js" defer></script>
<script src="modulos/abertura/opening-pontos.js"></script>
<script src="modulos/abertura/opening.js"></script>
<script src="modulos/abertura/boas-vindas.js"></script>
</body>
</html>
